spring:
  application:
    name: log-intelligence-ai-deploy
  main:
    banner-mode: off
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma3:1b
          temperature: 0.1

logai:
  ai:
    system-prompt: |
      Be concise and practical for production support triage.
      Base conclusions only on evidence in the provided logs.
      Clearly separate confirmed facts from assumptions.
      If evidence is insufficient, say "Insufficient evidence" and list what is missing.
      Prefer the most likely root cause over long speculative lists.
      Keep remediation and verification steps actionable.

  mask:
    ip_port: true
    email: true
    uuid: true
    mac: true
    jdbc: true
    host: true
    cn: true
    id: true
    fingerprint: true

logging:
  level:
    org.springframework.ai.chat.client.advisor: OFF
